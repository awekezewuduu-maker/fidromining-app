<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fidromining</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    body { background-color: #F6F4EE; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .nav-active { color: #155E45; font-weight: 700; }
  </style>
</head>
<body class="text-slate-800 select-none pb-24">

  <!-- Header -->
  <header class="bg-[#F6F4EE] px-4 py-3 flex items-center justify-between border-b border-stone-200 sticky top-0 z-40">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-[#155E45] flex items-center justify-center text-white text-xs font-bold">FM</div>
      <div>
        <h1 class="font-bold text-base text-[#155E45] leading-tight">FIDROMINING</h1>
        <p class="text-[9px] text-stone-500 uppercase">Cloud Hashrate</p>
      </div>
    </div>
    <div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-full border border-stone-200">
      <span class="text-xs font-bold text-[#155E45]" id="header-balance">0.50 USD</span>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-3">
    <div id="status-banner" class="hidden mb-3 p-3 rounded-2xl text-xs font-semibold text-center border"></div>

    <!-- Properties -->
    <section id="tab-properties" class="tab-page">
      <div class="space-y-4">
        <div class="bg-white rounded-3xl p-4 border border-stone-200 shadow-sm">
          <h3 class="font-bold text-base text-stone-800">Beach Bungalow</h3>
          <p class="text-xs text-stone-400">Daily yield: +$0.10 USD</p>
          <div class="flex justify-between items-center mt-3">
            <span class="font-bold text-stone-800">$0.50 USD</span>
            <button onclick="alert('Leased!')" class="bg-[#155E45] text-white text-xs px-4 py-2 rounded-xl font-bold">Open Property</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Wallet -->
    <section id="tab-wallet" class="tab-page hidden">
      <div class="bg-gradient-to-br from-[#155E45] to-[#0E3E2E] text-white rounded-3xl p-5 mb-4">
        <span class="text-xs text-emerald-200 block">Available Balance</span>
        <div class="text-3xl font-extrabold mt-1" id="wallet-balance">0.50 USD</div>
      </div>

      <div class="space-y-2">
        <div onclick="openModal('USDT BEP20', '1.00', '0x85b26f4e0906a7ee1fefdc09cd4fac5f308ec2e7')" class="bg-white p-3 rounded-2xl border border-stone-200 flex justify-between items-center cursor-pointer">
          <div class="text-xs font-bold">USDT (BEP20)</div>
          <span class="text-xs text-stone-400">Deposit &rarr;</span>
        </div>
        <div onclick="openModal('USDT TRC20', '1.00', 'TKLnq5VdEVBaGQwjGWCNLGkrMaZD27wpfx')" class="bg-white p-3 rounded-2xl border border-stone-200 flex justify-between items-center cursor-pointer">
          <div class="text-xs font-bold">USDT (TRC20)</div>
          <span class="text-xs text-stone-400">Deposit &rarr;</span>
        </div>
      </div>
    </section>

    <!-- Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#F6F4EE] border-t border-stone-200 px-4 py-3 flex justify-around">
      <button onclick="switchTab('properties')" class="text-xs font-bold">Properties</button>
      <button onclick="switchTab('wallet')" class="text-xs font-bold text-[#155E45]">Wallet</button>
    </nav>
  </main>

  <!-- Modal -->
  <div id="deposit-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-5 w-full max-w-sm text-center">
      <h3 class="font-bold text-base" id="modal-coin">Deposit</h3>
      <div class="my-3 bg-stone-50 p-2.5 rounded-xl border text-xs font-mono break-all" id="modal-addr"></div>
      <input type="number" id="dep-amt" placeholder="Amount (USD)" class="w-full bg-stone-50 border p-2 text-xs rounded-xl mb-2" />
      <input type="text" id="dep-txid" placeholder="Transaction TXID" class="w-full bg-stone-50 border p-2 text-xs rounded-xl mb-3" />
      <button onclick="submitDeposit()" class="w-full bg-[#155E45] text-white py-2.5 rounded-xl text-xs font-bold">Submit Proof</button>
      <button onclick="closeModal()" class="mt-2 text-xs text-stone-400">Cancel</button>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://broken-grass-597c.awekezewuduu.workers.dev";
    let balance = 0.50;
    let curCoin = "";
    let userId = "8181751673";
    let userHandle = "@Biilget";

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      const u = window.Telegram.WebApp.initDataUnsafe?.user;
      if (u) {
        userId = u.id;
        userHandle = u.username ? '@' + u.username : u.first_name;
      }
    }

    async function syncData() {
      try {
        const res = await fetch(`${WORKER_URL}/status?uid=${userId}`);
        const data = await res.json();
        if (data.balance) {
          balance = parseFloat(data.balance);
          document.getElementById('header-balance').innerText = balance.toFixed(2) + " USD";
          document.getElementById('wallet-balance').innerText = balance.toFixed(2) + " USD";
        }
      } catch (e) {}
    }
    syncData();
    setInterval(syncData, 5000);

    function switchTab(t) {
      document.querySelectorAll('.tab-page').forEach(e => e.classList.add('hidden'));
      document.getElementById('tab-' + t).classList.remove('hidden');
    }

    function openModal(coin, min, addr) {
      curCoin = coin;
      document.getElementById('modal-coin').innerText = "Deposit " + coin;
      document.getElementById('modal-addr').innerText = addr;
      document.getElementById('deposit-modal').classList.remove('hidden');
      document.getElementById('deposit-modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('deposit-modal').classList.add('hidden');
      document.getElementById('deposit-modal').classList.remove('flex');
    }

    async function submitDeposit() {
      const amt = document.getElementById('dep-amt').value;
      const txid = document.getElementById('dep-txid').value.trim();
      if (!amt || !txid) return alert("Fill all fields");

      await fetch(`${WORKER_URL}/submit-deposit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, username: userHandle, coin: curCoin, amount: amt, txid })
      });

      alert("Submitted! Wait for verification.");
      closeModal();
    }
  </script>
</body>
</html>
